name: Validate and finalize X HD guide content

on:
  push:
    branches:
      - content/x-video-hd-device-guide
    paths:
      - .github/workflows/finalize-x-hd-guide-v2.yml

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out guide branch
        uses: actions/checkout@v4
        with:
          ref: content/x-video-hd-device-guide
          fetch-depth: 0

      - name: Install FFmpeg for real MP4 inspection
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Finalize content and run focused regression checks
        shell: bash
        run: python scripts/finalize_x_hd_guide.py

      - name: Commit finalized article, Guides card, and sitemap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/how-to-download-x-twitter-videos-hd-any-device.html index.html sitemap.xml
          git diff --cached --quiet && { echo "No finalization changes required"; exit 0; }
          git commit -m "content: finalize X HD guide publishing"
          git push origin HEAD:content/x-video-hd-device-guide
