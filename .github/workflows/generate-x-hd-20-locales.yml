name: Generate and validate 20-locale X HD guide series

on:
  push:
    branches:
      - content/x-hd-guide-20-locales
    paths:
      - .github/workflows/generate-x-hd-20-locales.yml

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out locale branch
        uses: actions/checkout@v4
        with:
          ref: content/x-hd-guide-20-locales
          fetch-depth: 0

      - name: Install media and multilingual font tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin fonts-noto-core fonts-noto-cjk

      - name: Compile generator and locale data
        shell: bash
        run: |
          python -m py_compile \
            scripts/x_hd_locale_data_1.py \
            scripts/x_hd_locale_data_2.py \
            scripts/x_hd_locale_data_3.py \
            scripts/generate_x_hd_20_locales.py

      - name: Generate 19 missing locales and run focused checks
        shell: bash
        run: python scripts/generate_x_hd_20_locales.py | tee /tmp/x-hd-20-locales-validation.json

      - name: Commit generated articles, unique media, index, and sitemap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles assets index.html sitemap.xml
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "content: complete X HD guide in 20 languages"
          git push origin HEAD:content/x-hd-guide-20-locales
