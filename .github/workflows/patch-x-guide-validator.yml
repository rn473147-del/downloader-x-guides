name: Patch X guide validator

on:
  push:
    branches:
      - content/x-video-hd-device-guide
    paths:
      - .github/workflows/patch-x-guide-validator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out guide branch
        uses: actions/checkout@v4
        with:
          ref: content/x-video-hd-device-guide
          fetch-depth: 0

      - name: Add ffmpeg installation to validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-x-guide-content.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace("    if: github.actor != 'github-actions[bot]'\n", '')
          needle = '      - name: Validate article, unique media, metadata, and video\n'
          install = '''      - name: Install FFmpeg for real MP4 inspection
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

'''
          if 'Install FFmpeg for real MP4 inspection' not in text:
              if needle not in text:
                  raise SystemExit('Validation step not found')
              text = text.replace(needle, install + needle, 1)
          workflow.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-x-guide-validator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-x-guide-content.yml .github/workflows/patch-x-guide-validator.yml
          git commit -m "ci: enable real MP4 inspection for X guide"
          git push origin HEAD:content/x-video-hd-device-guide
