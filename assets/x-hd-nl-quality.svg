<svg xmlns="http://www.w3.org/2000/svg" xml:lang="nl" viewBox="0 0 1200 675" role="img"><title>4. HD kiezen op basis van bron en doel</title><desc>Een HD-label is alleen betrouwbaar wanneer het bij een werkelijk beschikbare mediavariant van het openbare bericht hoort. Op telefoon en laptop biedt 720p vaak balans tussen scherpte, data en opslag; 1080p is nuttig op grotere schermen als de bron het echt aanbiedt. Twee bestanden met dezelfde resolutie kunnen verschillen in bitrate, codec en compressie, dus speel ze af en vertrouw niet alleen op de naam. Als geluid nodig is, kies een gecombineerde video- en audio-optie en controleer de track direct na het opslaan.</desc><rect width="1200" height="675" rx="38" fill="#e2f2de"/><text x="60" y="82" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#624013" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="39" font-weight="850">4. HD kiezen op basis van bron en doel</text><text x="60" y="172" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#3fbd1f" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="18" font-weight="750">🇳🇱 Nederlands · NL · ORIGINAL VISUAL 2/5</text><g transform="translate(60 230)"><rect width="330" height="340" rx="28" fill="#fff" stroke="#3fbd1f" stroke-width="2"/><circle cx="63" cy="65" r="38" fill="#e2f2de"/><text x="63" y="74" text-anchor="middle" fill="#3fbd1f" font-family="Noto Sans,sans-serif" font-size="20" font-weight="850">SD</text><text x="30" y="145" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#624013" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="27" font-weight="800">Compact</text><text x="30" y="205" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#51627d" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">Een HD-label is alleen betrouwbaar</text><text x="30" y="2