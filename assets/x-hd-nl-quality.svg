ction="ltr" unicode-bidi="plaintext" fill="#51627d" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">beschikbare mediavariant van het</text><text x="30" y="289" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#51627d" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">openbare bericht hoort. Op telefoon</text><text x="30" y="317" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#51627d" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">en laptop biedt 720p vaak balans…</text></g><g transform="translate(820 230)"><rect width="330" height="340" rx="28" fill="#fff" stroke="#7642cf" stroke-width="2"/><circle cx="63" cy="65" r="38" fill="#f1eafe"/><text x="63" y="74" text-anchor="middle" fill="#7642cf" font-family="Noto Sans,sans-serif" font-size="20" font-weight="850">1080p</text><text x="30" y="145" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#624013" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="27" font-weight="800">High detail</text><text x="30" y="205" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#51627d" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">Een HD-label is alleen betrouwbaar</text><text x="30" y="233" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#51627d" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">wanneer het bij een werkelijk</text><text x="30" y="261" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#51627d" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">beschikbare mediavariant van het</text><text x="30" y="289" text-anchor="start" direction="ltr" unicode-bidi