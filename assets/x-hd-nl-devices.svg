<svg xmlns="http://www.w3.org/2000/svg" xml:lang="nl" viewBox="0 0 1200 675" role="img"><title>5. Opslaan op iPhone, Android, Windows of Mac</title><desc>Op iPhone en iPad staan Safari-downloads meestal in de Bestanden-app, Downloads of de ingestelde locatie. Op Android kijk je in de downloadlijst van de browser of de Files-app. Op Windows, macOS, Linux en ChromeOS controleer je de map Downloads en browsergeschiedenis voordat je opnieuw klikt. Is er weinig ruimte, verwijder dan onnodige kopieën of kies lagere resolutie. Installeer geen onbekende downloadmanager alleen omdat een pagina zegt dat dit verplicht is.</desc><rect width="1200" height="675" rx="38" fill="#624013"/><circle cx="1120" cy="80" r="220" fill="#5322d3" opacity=".16"/><text x="60" y="82" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#ffffff" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="40" font-weight="850">5. Opslaan op iPhone, Android, Windows of Mac</text><text x="60" y="175" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#cdeaff" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="18" font-weight="700">🇳🇱 Nederlands · ORIGINAL VISUAL 3/5</text><g transform="translate(60 235)"><rect width="330" height="345" rx="28" fill="#fff"/><circle cx="165" cy="92" r="62" fill="#f0eef7" stroke="#3fbd1f" stroke-width="4"/><text x="165" y="111" text-anchor="middle" fill="#624013" font-family="Noto Sans,sans-serif" font-size="45" font-weight="800">▯</text><text x="165" y="196" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" fill="#624013" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="28" font-weight="850">iPhone / iPad</text><text x="30" y="245" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#53657f" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">Op iPhone en iPad staan</text><