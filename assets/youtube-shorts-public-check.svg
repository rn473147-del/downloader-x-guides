<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Memeriksa tautan YouTube Shorts publik</title>
  <desc id="desc">Ilustrasi asli ponsel vertikal, ikon tautan, rasio sembilan banding enam belas, dan daftar pemeriksaan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081a3c"/><stop offset=".6" stop-color="#4237ca"/><stop offset="1" stop-color="#ee6b8d"/></linearGradient>
    <linearGradient id="screen" x1="0" x2="1"><stop stop-color="#26c9f4"/><stop offset=".55" stop-color="#6e4af5"/><stop offset="1" stop-color="#ff9e7c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020817" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="170" fill="#fff" opacity=".06"/><circle cx="125" cy="600" r="220" fill="#28c7f4" opacity=".08"/>
  <text x="70" y="83" fill="#fff" font-family="system-ui,sans-serif" font-size="34" font-weight="800">YouTube Shorts publik</text>
  <text x="70" y="125" fill="#dce7ff" font-family="system-ui,sans-serif" font-size="22">Tautan → status publik → rasio vertikal → izin</text>
  <g filter="url(#shadow)">
    <rect x="105" y="175" width="300" height="430" rx="46" fill="#071429" stroke="#a9c5ff" stroke-width="6"/>
    <rect x="129" y="216" width="252" height="340" rx="27" fill="url(#screen)"/>
    <rect x="215" y="191" width="80" height="9" rx="5" fill="#8ca7d8"/>
    <path d="M223 315v142l122-71z" fill="#fff" opacity=".94"/>
    <rect x="191" y="572" width="128" height="10" rx="5" fill="#657ca7"/>
  </g>
  <g transform="translate(470 202)">
    <rect width="265" height="110" rx="26" fill="#fff" opacity=".96"/>
    <path d="M65 45c18-18 48 9 29 28L78 89c-20 20-48-10-29-29l9-9" fill="none" stroke="#2168f3" stroke-width="12" stroke-linecap="round"/>
    <path d="M82 64c-18 18-48-9-29-28l16-16c20-20 48 10 29 29l-9 9" fill="none" stroke="#6e4af5" stroke-width="12" stroke-linecap="round"/>
    <text x="125" y="53" fill="#102040" font-family="system-ui,sans-serif" font-size="22" font-weight="800">Salin tautan</text>
    <text x="125" y="82" fill="#60708d" font-family="system-ui,sans-serif" font-size="17">dari Bagikan</text>
  </g>
  <g transform="translate(470 338)">
    <rect width="265" height="110" rx="26" fill="#fff" opacity=".96"/>
    <rect x="40" y="20" width="49" height="72" rx="9" fill="none" stroke="#2168f3" stroke-width="6"/>
    <path d="M102 32h55M102 55h78M102 78h66" stroke="#9ab1d6" stroke-width="10" stroke-linecap="round"/>
    <text x="194" y="53" text-anchor="middle" fill="#102040" font-family="system-ui,sans-serif" font-size="22" font-weight="800">9:16</text>
    <text x="194" y="82" text-anchor="middle" fill="#60708d" font-family="system-ui,sans-serif" font-size="17">vertikal</text>
  </g>
  <g transform="translate(790 175)" filter="url(#shadow)">
    <rect width="315" height="360" rx="32" fill="#fff"/>
    <text x="36" y="57" fill="#102040" font-family="system-ui,sans-serif" font-size="27" font-weight="850">Periksa sebelum pakai</text>
    <g fill="none" stroke="#11a579" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M43 116l14 15 27-34"/><path d="M43 180l14 15 27-34"/><path d="M43 244l14 15 27-34"/><path d="M43 308l14 15 27-34"/>
    </g>
    <g fill="#33415c" font-family="system-ui,sans-serif" font-size="21">
      <text x="105" y="125">Video yang benar</text><text x="105" y="189">Akses publik</text><text x="105" y="253">Pilihan nyata</text><text x="105" y="317">Hak penggunaan</text>
    </g>
  </g>
  <rect x="470" y="492" width="265" height="76" rx="22" fill="#fff1c7"/>
  <text x="602" y="522" text-anchor="middle" fill="#7b5700" font-family="system-ui,sans-serif" font-size="18" font-weight="800">Jangan menjanjikan</text>
  <text x="602" y="548" text-anchor="middle" fill="#7b5700" font-family="system-ui,sans-serif" font-size="18">fitur yang belum terbukti</text>
</svg>
