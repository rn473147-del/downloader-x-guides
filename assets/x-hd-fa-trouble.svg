<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fa" viewBox="0 0 1200 675" role="img"><title>مشکل را از منبع تا فایل مرحله‌ای پیدا کنید</title><desc>پیوند پروفایل را باز می‌کند · فقط هنگام ورود باز می‌شود · گزینه کیفیت دیده نمی‌شود · HTML به جای MP4 ذخیره می‌شود</desc><rect width="1200" height="675" rx="38" fill="#f7eef2"/><text x="60" y="78" text-anchor="start" direction="rtl" unicode-bidi="plaintext" fill="#586213" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="40" font-weight="850">مشکل را از منبع تا فایل مرحله‌ای پیدا کنید</text><text x="60" y="155" text-anchor="start" direction="rtl" unicode-bidi="plaintext" fill="#1fbda6" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="18" font-weight="700">🇮🇷 فارسی · ORIGINAL VISUAL 4/5</text><g transform="translate(250 190)"><rect width="700" height="88" rx="22" fill="#fff" stroke="#1fbda6" stroke-width="3"/><circle cx="50" cy="44" r="28" fill="#1fbda6"/><text x="50" y="53" text-anchor="middle" fill="#fff" font-family="Noto Sans,sans-serif" font-size="22" font-weight="850">1</text><text x="100" y="39" text-anchor="start" direction="rtl" unicode-bidi="plaintext" fill="#586213" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="22" font-weight="800">پیوند پروفایل را باز می‌کند</text></g><g transform="translate(250 302)"><rect width="700" height="88" rx="22" fill="#fff" stroke="#d3226d" stroke-width="3"/><circle cx="50" cy="44" r="28" fill="#d3226d"/><text x="50" y="53" text-anchor="middle" fill="#fff" font-family="Noto Sans,sans-serif" font-size="22" font-weight="850">2</text><text x="100" y="39" text-anchor="start" direction="rtl" unicode-bidi="plaintext" fill="#586213" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="22" font-weight="800">فقط هنگام ورود باز می‌شود</text></g><g transform="translate(250 414)"><rect width="700" height="88" rx="22" fill="#fff" stroke="#1fbda6" stroke-width="3