<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Troubleshooting a public X video download</title><desc id="d">Original decision tree for checking the public post, URL, returned variants, browser permissions, and saved file.</desc><rect width="1200" height="800" rx="36" fill="#f7f9fd"/><text x="70" y="80" fill="#102a55" font-family="system-ui,sans-serif" font-size="44" font-weight="800">Troubleshoot from the source outward</text><text x="70" y="122" fill="#64748b" font-family="system-ui,sans-serif" font-size="23">Do not keep clicking. Check one layer at a time and stop at the first failed condition.</text><g font-family="system-ui,sans-serif" text-anchor="middle">
<g transform="translate(405 165)"><rect width="390" height="95" rx="24" fill="#102a55"/><text x="195" y="39" fill="#fff" font-size="24" font-weight="800">Does the copied URL open the exact post?</text><text x="195" y="70" fill="#c9dcff" font-size="18">Use X Share → Copy link to Post</text></g>
<path d="M600 260v55" stroke="#94a3b8" stroke-width="5"/><g transform="translate(405 315)"><rect width="390" height="95" rx="24" fill="#2563eb"/><text x="195" y="39" fill="#fff" font-size="24" font-weight="800">Is the post public and still available?</text><text x="195" y="70" fill="#dbeafe" font-size="18">Do not bypass protected or restricted access</text></g>
<path d="M600 410v55" stroke="#94a3b8" stroke-width="5"/><g transform="translate(405 465)"><rect width="390" height="95" rx="24" fill="#0f766e"/><text x="195" y="39" fill="#fff" font-size="24" font-weight="800">Did the tool return real media options?</text><text x="195" y="70" fill="#ccfbf1" font-size="18">Select only the variants shown</text></g>
<path d="M600 560v55" stroke="#94a3b8" stroke-width="5"/><g transform="translate(405 615)"><rect width="390" height="95" rx="24" fill="#6d28d9"/><text x="195" y="39" fill="#fff" font-size="24" font-weight="800">Does the saved MP4 open correctly?</text><text x="195" y="70" fill="#ede9fe" font-size="18">Check extension, size, video, and audio</text></g>
<g transform="translate(70 315)"><rect width="250" height="95" rx="22" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/><text x="125" y="38" fill="#9f1239" font-size="22" font-weight="800">No</text><text x="125" y="69" fill="#9f1239" font-size="17">Copy a fresh post URL</text></g><path d="M405 362H320" stroke="#fb7185" stroke-width="5"/>
<g transform="translate(880 465)"><rect width="250" height="95" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><text x="125" y="38" fill="#9a3412" font-size="22" font-weight="800">No</text><text x="125" y="69" fill="#9a3412" font-size="17">Record the exact error</text></g><path d="M795 512h85" stroke="#fb923c" stroke-width="5"/>
</g><text x="600" y="760" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="20">A different browser can fix a display issue; it cannot make deleted or protected content public.</text></svg>