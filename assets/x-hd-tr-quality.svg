<svg xmlns="http://www.w3.org/2000/svg" xml:lang="tr" viewBox="0 0 1200 675" role="img"><title>4. Kaynağa ve amaca göre HD seçin</title><desc>HD etiketi ancak herkese açık gönderide gerçekten bulunan medya varyantına dayanıyorsa güvenilirdir. Telefon ve dizüstünde 720p çoğu zaman netlik, veri ve depolama dengesi sağlar; 1080p kaynak gerçekten sunduğunda ve büyük ekranda ayrıntı gerektiğinde uygundur. Aynı çözünürlükteki iki dosya bitrate, codec ve sıkıştırma nedeniyle farklı görünebilir; adı yerine oynatmayı kontrol edin. Ses gerekliyse video ve ses içeren birleşik seçeneği seçin ve kayıttan sonra izi doğrulayın.</desc><rect width="1200" height="675" rx="38" fill="#dee2f2"/><text x="60" y="82" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#136254" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="39" font-weight="850">4. Kaynağa ve amaca göre HD seçin</text><text x="60" y="172" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#1f3fbd" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="18" font-weight="750">🇹🇷 Türkçe · TR · ORIGINAL VISUAL 2/5</text><g transform="translate(60 230)"><rect width="330" height="340" rx="28" fill="#fff" stroke="#1f3fbd" stroke-width="2"/><circle cx="63" cy="65" r="38" fill="#dee2f2"/><text x="63" y="74" text-anchor="middle" fill="#1f3fbd" font-family="Noto Sans,sans-serif" font-size="20" font-weight="850">SD</text><text x="30" y="145" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#136254" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="27" font-weight="800">Compact</text><text x="30" y="205" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#51627d" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">HD etiketi ancak herkese açık</text><text x="30" y="233" text-anchor="start" direction="ltr" unicode-bidi="plainte