<svg xmlns="http://www.w3.org/2000/svg" xml:lang="pt" viewBox="0 0 1200 675" role="img"><title>4. Escolher HD conforme a fonte e a finalidade</title><desc>Uma indicação HD é confiável somente quando corresponde a uma variante realmente disponível na publicação pública. Em celular e notebook, 720p costuma equilibrar nitidez, dados e armazenamento. 1080p é útil em telas maiores quando a origem realmente oferece. Dois arquivos com a mesma resolução podem ter bitrate, codec e compressão diferentes; reproduza-os em vez de julgar pelo nome. Se o áudio for necessário, escolha uma opção combinada de vídeo e som e confira a faixa logo após salvar.</desc><rect width="1200" height="675" rx="38" fill="#f2eede"/><text x="60" y="82" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#621340" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="39" font-weight="850">4. Escolher HD conforme a fonte e a finalidade</text><text x="60" y="172" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#bd9e1f" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="18" font-weight="750">🇧🇷 Português · PT · ORIGINAL VISUAL 2/5</text><g transform="translate(60 230)"><rect width="330" height="340" rx="28" fill="#fff" stroke="#bd9e1f" stroke-width="2"/><circle cx="63" cy="65" r="38" fill="#f2eede"/><text x="63" y="74" text-anchor="middle" fill="#bd9e1f" font-family="Noto Sans,sans-serif" font-size="20" font-weight="850">SD</text><text x="30" y="145" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#621340" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="27" font-weight="800">Compact</text><text x="30" y="205" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#51627d" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">Uma indicação HD é confiável</text><text x="30" y="233" text-anchor="sta