<svg xmlns="http://www.w3.org/2000/svg" xml:lang="tr" viewBox="0 0 1200 675" role="img"><title>5. iPhone, Android, Windows veya Mac’e kaydedin</title><desc>iPhone ve iPad’de Safari indirmeleri genellikle Dosyalar uygulamasında Downloads klasöründe veya ayarlanan konumdadır. Android’de tarayıcı indirme listesine veya Files uygulamasına bakın. Windows, macOS, Linux ve ChromeOS’ta yeniden tıklamadan önce Downloads klasörü ile tarayıcı geçmişini kontrol edin. Alan azsa gereksiz kopyaları silin veya düşük çözünürlük seçin. Bir sayfa zorunlu dedi diye bilinmeyen yönetici ya da eklenti kurmayın.</desc><rect width="1200" height="675" rx="38" fill="#136254"/><circle cx="1120" cy="80" r="220" fill="#ccd322" opacity=".16"/><text x="60" y="82" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#ffffff" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="40" font-weight="850">5. iPhone, Android, Windows veya Mac’e kaydedin</text><text x="60" y="175" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#cdeaff" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="18" font-weight="700">🇹🇷 Türkçe · ORIGINAL VISUAL 3/5</text><g transform="translate(60 235)"><rect width="330" height="345" rx="28" fill="#fff"/><circle cx="165" cy="92" r="62" fill="#f6f7ee" stroke="#1f3fbd" stroke-width="4"/><text x="165" y="111" text-anchor="middle" fill="#136254" font-family="Noto Sans,sans-serif" font-size="45" font-weight="800">▯</text><text x="165" y="196" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" fill="#136254" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="28" font-weight="850">iPhone / iPad</text><text x="30" y="245" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#53657f" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">iPhone ve iPad’de Safari</text><text x="30" y="272" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#53657f" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">indirmeleri genellikle Dosyalar</text><text x="30" y="299" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#53657f" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">uygulamasında Downloads klasöründe</text><text x="30" y="326" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#53657f" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">veya ayarlanan konumdadır…</text></g><g transform="translate(440 235)"><rect width="330" height="345" rx="28" fill="#fff"/><circle cx="165" cy="92" r="62" fill="#dee2f2" stroke="#1f3fbd" stroke-width="4"/><text x="165" y="111" text-anchor="middle" fill="#136254" font-family="Noto Sans,sans-serif" font-size="45" font-weight="800">◉</text><text x="165" y="196" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" fill="#136254" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="28" font-weight="850">Android</text><text x="30" y="245" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#53657f" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">iPhone ve iPad’de Safari</text><text x="30" y="272" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#53657f" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">indirmeleri genellikle Dosyalar</text><text x="30" y="299" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#53657f" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">uygulamasında Downloads klasöründe</text><text x="30" y="326" text-anchor="start" direction="ltr" unicode-bi