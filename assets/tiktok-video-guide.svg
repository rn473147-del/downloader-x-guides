    <rect x="38" y="415" width="132" height="10" rx="5" fill="#8490a8"/>
    <rect x="38" y="441" width="154" height="10" rx="5" fill="#606c84"/>
    <rect x="38" y="482" width="182" height="34" rx="17" fill="url(#line)"/>
    <path d="M116 491 v11 h-9 l22 18 22-18h-9v-11z" fill="#07101d"/>
