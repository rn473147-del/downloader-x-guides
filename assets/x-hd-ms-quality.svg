<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ms" viewBox="0 0 1200 675" role="img"><title>4. Pilih HD mengikut sumber dan tujuan</title><desc>Label HD boleh dipercayai hanya apabila ia berasal daripada varian media yang benar-benar tersedia pada hantaran awam. Pada telefon dan komputer riba, 720p sering menyeimbangkan kejelasan, data dan ruang; 1080p berguna pada skrin besar apabila sumber benar-benar menyediakannya. Dua fail dengan resolusi sama boleh berbeza bitrate, codec dan mampatan, jadi mainkan fail dan jangan menilai melalui nama sahaja. Jika audio diperlukan, pilih pilihan gabungan video dan bunyi serta semak trek selepas disimpan.</desc><rect width="1200" height="675" rx="38" fill="#e9f2de"/><text x="60" y="82" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#621322" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="39" font-weight="850">4. Pilih HD mengikut sumber dan tujuan</text><text x="60" y="172" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#79bd1f" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="18" font-weight="750">🇲🇾 Bahasa Melayu · MS · ORIGINAL VISUAL 2/5</text><g transform="translate(60 230)"><rect width="330" height="340" rx="28" fill="#fff" stroke="#79bd1f" stroke-width="2"/><circle cx="63" cy="65" r="38" fill="#e9f2de"/><text x="63" y="74" text-anchor="middle" fill="#79bd1f" font-family="Noto Sans,sans-serif" font-size="20" font-weight="850">SD</text><text x="30" y="145" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#621322" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="27" font-weight="800">Compact</text><text x="30" y="205" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#51627d" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="450">Label HD boleh dipercayai hanya</text><text x="30" y="233" text-ancho