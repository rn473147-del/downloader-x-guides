<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 1200 630" role="img"><title>X（Twitter）の公開動画をどの端末でもHDで保存する方法</title><desc>正しい公開投稿URLをコピーし、実際に表示された画質だけを選び、保存後に映像・音声・出所を確認する実践ガイドです。</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4b6213"/><stop offset=".58" stop-color="#1fbd36"/><stop offset="1" stop-color="#d32236"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity=".25"/></filter></defs><rect width="1200" height="630" rx="38" fill="url(#g)"/><circle cx="1080" cy="80" r="240" fill="#def2e1" opacity=".16"/><circle cx="100" cy="610" r="250" fill="#f7eeef" opacity=".12"/><text x="60" y="72" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#dff7ff" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="22" font-weight="700">🇯🇵 日本語 · DOWNLOADER-X GUIDES</text><text x="60" y="145" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#ffffff" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="49" font-weight="850">X（Twitter）の公開動画をどの端</text><text x="60" y="205" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#ffffff" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="49" font-weight="850">末でもHDで保存する方法</text><text x="60" y="315" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#e9f4ff" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="22" font-weight="500">正しい公開投稿URLをコピーし、実際に表示された画質だけを選び、保存後に映像・音声・出所を確認する実践ガイドです。</text><g filter="url(#s)"><g transform="translate(60 380)"><rect width="245" height="175" rx="25" fill="#ffffff"/><circle cx="52" cy="52" r="31" fill="#1fbd36"/><text x="52" y="62" text-anchor="middle" fill="#fff" font-family="Noto Sans,sans-serif" font-size="28" font-weight="800">1</text><text x="25" y="115" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#4b6213" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="22" font-weight="800">リンクをコピー</text></g><g transform="translate(340 380)"><rect width="245" height="175" rx="25" fill="#ffffff"/><circle cx="52" cy="52" r="31" fill="#d32236"/><text x="52" y="62" text-anchor="middle" fill="#fff" font-family="Noto Sans,sans-serif" font-size="28" font-weight="800">2</text><text x="25" y="115" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#4b6213" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="22" font-weight="800">URLを貼り付け</text></g><g transform="translate(620 380)"><rect width="245" height="175" rx="25" fill="#ffffff"/><circle cx="52" cy="52" r="31" fill="#1fbd36"/><text x="52" y="62" text-anchor="middle" fill="#fff" font-family="Noto Sans,sans-serif" font-size="28" font-weight="800">3</text><text x="25" y="115" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#4b6213" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="22" font-weight="800">画質を選択</text></g><g transform="translate(900 380)"><rect width="245" height="175" rx="25" fill="#ffffff"/><circle cx="52" cy="52" r="31" fill="#d32236"/><text x="52" y="62" text-anchor="middle" fill="#fff" font-family="Noto Sans,sans-serif" font-size="28" font-weight="800">4</text><text x="25" y="115" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#4b6213" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="22" font-weight="800">ファイル確認</text></g></g><text x="60" y="605" text-anchor="start" direction="ltr" unicode-bidi="plaintext" fill="#d7efff" font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Arabic, sans-serif" font-size="16" font-weight="600">JA · ORIGINAL VISUAL 1/5</text></svg>